[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "airmouse-flight-control"
version = "0.1.0"
description = "AirMouse V1 transport-independent flight-control core."
requires-python = ">=3.10"
dependencies = [
    "pymavlink",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["flight_control*"]
